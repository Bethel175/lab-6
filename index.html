<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paws &amp; Stay Pet Sitting | Home</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar md:navbar-expand bg-1">
    <div class="container">
      <a class="navbar-brand" href="index.html">Paws &amp; Stay</a>
      <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>
      <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
        <div class="drawer-header">
          <span class="drawer-title" id="navbarDrawerLabel">Menu</span>
          <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
        </div>
        <div class="drawer-body">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Services</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>

  <main class="container my-5">

    <h1 class="text-center fw-bold mb-4">Loving pet care while you're away</h1>

    <!-- CAROUSEL -->
    <div id="petCarousel" class="carousel slide">
      <div class="carousel-inner rounded-5">
        <div class="carousel-item active">
          <img src="images/slide1.jpg" class="d-block w-100" alt="A person walking a small white dog past sunflowers">
        </div>
        <div class="carousel-item">
          <img src="images/slide2.jpg" class="d-block w-100" alt="A tabby cat resting on a grey couch">
        </div>
        <div class="carousel-item">
          <img src="images/slide3.jpg" class="d-block w-100" alt="A smiling woman hugging a chocolate Labrador in a park">
        </div>
      </div>
      <div>
        <button class="btn-icon btn-sm" type="button" data-bs-target="#petCarousel" data-bs-slide="prev">
          <span class="carousel-icon-prev" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="btn-icon btn-sm" type="button" data-bs-target="#petCarousel" data-bs-slide="next">
          <span class="carousel-icon-next" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

  </main>

  <script src="js/bootstrap.bundle.min.js" type="module"></script>
</body>
</html>
